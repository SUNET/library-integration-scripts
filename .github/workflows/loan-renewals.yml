name: Loan Renewals CI and Release

on:
  push:
    branches: [main]
    paths:
      - packages/folio-client/**
      - integrations/loan-renewals/**
      - .dockerignore
      - .github/workflows/loan-renewals.yml
  pull_request:
    branches: [main]
    paths:
      - packages/folio-client/**
      - integrations/loan-renewals/**
      - .dockerignore
      - .github/workflows/loan-renewals.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Empty uses integrations/loan-renewals/pyproject.toml."
        type: string
        required: false
        default: ""
      publish_release:
        description: "Push image to GHCR, create a GitHub Release, and attach its archive."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run loan-renewals tests
        working-directory: integrations/loan-renewals
        run: |
          uv sync --frozen
          uv run python -m unittest discover -s tests -v

  build:
    name: Build Docker image (manual trigger only)
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      image: ${{ steps.metadata.outputs.image }}
      artifact: ${{ steps.metadata.outputs.artifact }}
      archive: ${{ steps.metadata.outputs.archive }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve image version
        id: metadata
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          PUBLISH_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("integrations/loan-renewals/pyproject.toml").read_text(encoding="utf-8")
          )
          version = os.environ["REQUESTED_VERSION"].strip() or project["project"]["version"]
          if not re.fullmatch(
              r"[0-9]+\.[0-9]+\.[0-9]+(?:-[A-Za-z0-9]+(?:[.-][A-Za-z0-9]+)*)?",
              version,
          ):
              raise SystemExit("Version must be X.Y.Z or X.Y.Z-suffix (without a v prefix).")

          if os.environ["PUBLISH_RELEASE"] != "true":
              version += (
                  f"-dev.{os.environ['GITHUB_RUN_NUMBER']}"
                  f".{os.environ['GITHUB_RUN_ATTEMPT']}"
                  f".{os.environ['GITHUB_SHA'][:12]}"
              )

          if len(version) > 128:
              raise SystemExit("Resulting version exceeds the Docker tag length limit.")

          owner = os.environ["REPO_OWNER"].lower()
          image = f"ghcr.io/{owner}/loan-renewals:{version}"
          archive = f"loan-renewals-{version}-linux-amd64"
          artifact = f"loan-renewals-image-{version}-linux-amd64"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"image={image}\n")
              output.write(f"artifact={artifact}\n")
              output.write(f"archive={archive}\n")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.publish_release == true }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build loan-renewals image (push only for release)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./integrations/loan-renewals/Dockerfile
          platforms: linux/amd64
          load: ${{ inputs.publish_release == true }}
          push: ${{ inputs.publish_release == true }}
          tags: ${{ steps.metadata.outputs.image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
          cache-from: type=gha,scope=loan-renewals
          cache-to: type=gha,scope=loan-renewals,mode=max

      - name: Export image archive and checksum
        if: ${{ inputs.publish_release == true }}
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          ARCHIVE: ${{ steps.metadata.outputs.archive }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker save "$IMAGE" | gzip > "artifacts/$ARCHIVE.tar.gz"
          (cd artifacts && sha256sum "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256")

      - name: Upload build artifacts
        if: ${{ inputs.publish_release == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact }}
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish opted-in GitHub Release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release == true }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download image archive and checksum
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ${{ needs.build.outputs.image }}
          ARCHIVE: ${{ needs.build.outputs.archive }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Loan Renewals Docker image built from integrations/loan-renewals/Dockerfile for linux/amd64.

          Source commit: $GITHUB_SHA
          Image: $IMAGE

          Pull the image from GitHub Container Registry:

              docker pull $IMAGE

          Alternatively, download the archive and checksum, then verify and load it:

              sha256sum -c $ARCHIVE.tar.gz.sha256
              docker load --input $ARCHIVE.tar.gz

          Supply runtime credentials separately; no deployment secrets are included.
          EOF
          gh release create "loan-renewals-v$VERSION" \
            "artifacts/$ARCHIVE.tar.gz" \
            "artifacts/$ARCHIVE.tar.gz.sha256" \
            --target "$GITHUB_SHA" \
            --title "Loan Renewals $VERSION" \
            --notes-file release-notes.md \
            --latest=false
