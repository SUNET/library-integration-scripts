[project]
name = "keycloak-client"
version = "0.1.0"
description = "Reusable Keycloak Admin API client package"
authors = [
    { name = "Benedith Mulongo", email = "benedith@sunet.se" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx2",
    "pydantic",
    "pydantic-settings",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
