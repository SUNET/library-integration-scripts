id: loan-renewals-bth
namespace: library.circulation
description: |
  Option 2 (One flow per tenant): Dedicated auto-renewal flow for BTH.
  Duplicate this file for additional tenants (e.g. loan-renewals-hh.yml).

inputs:
  - id: image
    type: STRING
    defaults: ghcr.io/sunet/loan-renewals:0.1.0
    description: Pre-built Docker image for loan-renewals.

  - id: environment
    type: STRING
    defaults: test
    description: Target FOLIO environment (test or prod).

  - id: execute
    type: BOOL
    defaults: false
    description: Perform actual renewals in FOLIO (false = dry-run).

  - id: renewal_window_rate
    type: FLOAT
    defaults: 0.1
    description: Fraction of the loan period before dueDate to trigger renewal [0.0, 1.0).

  - id: include_fixed_policy
    type: BOOL
    defaults: false
    description: Include Fixed due-date loan policies.

  - id: include_grace_period
    type: BOOL
    defaults: false
    description: Allow overdue loans still within loansPolicy.gracePeriod.

  - id: include_overdue
    type: BOOL
    defaults: false
    description: Include all overdue loans.

  - id: loan_types
    type: ARRAY
    itemType: STRING
    required: false
    description: Optional list of loan type names to include (empty = all loan types).

  - id: group_limits
    type: ARRAY
    itemType: STRING
    defaults:
      - staff=365
      - student=180
    description: Max total loan days from loanDate per patron group (format group=days).

  - id: max_renewals
    type: INT
    required: false
    description: Optional maximum number of renewals per execution.

tasks:
  - id: renew_loans_bth
    type: io.kestra.plugin.scripts.python.Commands
    retry:
      type: exponential
      interval: PT30S
      maxInterval: PT5M
      maxAttempt: 3
    containerImage: "{{ inputs.image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: IF_NOT_PRESENT
    env:
      ENVIRONMENT: "{{ inputs.environment }}"
      TENANT_KEY: bth
      FOLIO_TENANT: "{{ secret('FOLIO_TENANT_BTH') }}"
      FOLIO_TENANT_REALM: "{{ secret('FOLIO_REALM_BTH') }}"
      FOLIO_TENANT_USERNAME: "{{ secret('FOLIO_USERNAME_BTH') }}"
      FOLIO_TENANT_SECRET: "{{ secret('FOLIO_SECRET_BTH') }}"
    outputFiles:
      - "reports/*.json"
    commands:
      - |
        set -eu
        mkdir -p reports

        set -- \
          --tenant bth \
          --renewal-window-rate "{{ inputs.renewal_window_rate }}" \
          --json-output reports/renewals_report_bth.json

        if [ "{{ inputs.execute }}" = "true" ]; then
          set -- "$@" --execute
        fi
        if [ "{{ inputs.include_fixed_policy }}" = "true" ]; then
          set -- "$@" --include-fixed-policy
        fi
        if [ "{{ inputs.include_grace_period }}" = "true" ]; then
          set -- "$@" --include-grace-period
        fi
        if [ "{{ inputs.include_overdue }}" = "true" ]; then
          set -- "$@" --include-overdue
        fi
        {% if inputs.max_renewals != null %}
        set -- "$@" --max-renewals "{{ inputs.max_renewals }}"
        {% endif %}
        {% for lt in inputs.loan_types ?? [] %}
        set -- "$@" --loan-type "{{ lt }}"
        {% endfor %}
        {% for gl in inputs.group_limits ?? [] %}
        set -- "$@" --group-limit "{{ gl }}"
        {% endfor %}

        loan-renewals "$@"

triggers:
  - id: schedule_bth
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 */6 * * *"
    timezone: Europe/Stockholm
    disabled: true
    inputs:
      environment: test
      execute: false
      renewal_window_rate: 0.1
